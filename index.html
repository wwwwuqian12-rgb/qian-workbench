  <style>
:root{--pink-1:#fff0f5;--pink-2:#ffd6e7;--pink-3:#ffb6d5;--pink-4:#ff8fb1;--pink-5:#ff6fa5;--pink-deep:#ec5a92;--text:#5a3a4a;--shadow:0 4px 16px rgba(255,143,177,.25);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--pink-1);color:var(--text);}
.app{display:flex;min-height:100vh;}
.sidebar{width:96px;background:linear-gradient(180deg,var(--pink-4),var(--pink-5));position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;overflow-y:auto;z-index:20;box-shadow:2px 0 12px rgba(236,90,146,.2);}
.logo{font-size:13px;font-weight:800;color:#fff;text-align:center;margin-bottom:8px;line-height:1.3;text-shadow:0 1px 3px rgba(0,0,0,.15);}
.menu-item{flex:0 0 auto;width:80px;padding:10px 2px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff;cursor:pointer;transition:.2s;font-size:11px;text-align:center;background:rgba(255,255,255,.12);margin:3px 0;}
.menu-item .ico{font-size:22px;}
.menu-item.active{background:#fff;color:var(--pink-deep);font-weight:700;transform:scale(1.04);box-shadow:var(--shadow);}
.content{margin-left:96px;flex:1;padding:18px 16px 40px;max-width:760px;}
.page{display:none;animation:fade .3s;}
.page.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.card{background:#fff;border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow);}
.page-title{font-size:20px;font-weight:800;color:var(--pink-deep);margin:0 0 4px;display:flex;align-items:center;gap:8px;}
.page-sub{font-size:12px;color:#b089a0;margin:0 0 14px;}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px;color:var(--text);}
input,textarea,select{width:100%;border:2px solid var(--pink-2);border-radius:14px;padding:10px 12px;font-size:14px;font-family:inherit;background:var(--pink-1);color:var(--text);outline:none;}
input:focus,textarea:focus,select:focus{border-color:var(--pink-4);}
textarea{resize:vertical;min-height:64px;}
.btn{background:linear-gradient(135deg,var(--pink-4),var(--pink-5));color:#fff;border:none;border-radius:16px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);width:100%;margin-top:12px;}
.btn:active{transform:scale(.97);}
.btn.small{width:auto;padding:7px 14px;font-size:12px;border-radius:12px;margin-top:0;}
.row{display:flex;gap:10px;}
.row>*{flex:1;}
.stat-grid{display:flex;gap:10px;margin:10px 0;}
.stat{flex:1;background:var(--pink-1);border-radius:16px;padding:12px;text-align:center;}
.stat .num{font-size:24px;font-weight:800;color:var(--pink-deep);}
.stat .lab{font-size:11px;color:#b089a0;margin-top:2px;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal .cell{aspect-ratio:1;border-radius:10px;background:var(--pink-1);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text);cursor:pointer;border:2px solid transparent;}
.cal .cell.done{background:var(--pink-4);color:#fff;font-weight:700;}
.cal .cell.today{border-color:var(--pink-deep);}
.cal .wd{font-size:10px;color:#b089a0;text-align:center;font-weight:700;}
.item{background:var(--pink-1);border-radius:14px;padding:12px;margin-bottom:10px;}
.item h4{margin:0 0 4px;font-size:14px;color:var(--pink-deep);}
.item p{margin:0;font-size:12px;color:var(--text);line-height:1.5;}
.tag{display:inline-block;background:var(--pink-3);color:#fff;border-radius:8px;padding:2px 8px;font-size:11px;margin:3px 4px 0 0;}
.link-btn{display:inline-block;background:var(--pink-5);color:#fff;border-radius:12px;padding:7px 14px;font-size:12px;font-weight:700;text-decoration:none;margin-top:8px;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th,td{border:1px solid var(--pink-2);padding:7px 6px;text-align:left;}
th{background:var(--pink-2);color:var(--pink-deep);}
.play{background:var(--pink-4);color:#fff;border:none;border-radius:50%;width:34px;height:34px;font-size:14px;cursor:pointer;margin-left:8px;}
.word-row{display:flex;align-items:center;justify-content:space-between;background:var(--pink-1);border-radius:14px;padding:10px 14px;margin-bottom:8px;}
.word-row .en{font-weight:700;color:var(--pink-deep);font-size:15px;}
.word-row .ph{font-size:12px;color:#b089a0;}
.word-row .cn{font-size:12px;}
.del{background:#ffd0d0;color:#c0392b;border:none;border-radius:10px;padding:4px 9px;font-size:11px;cursor:pointer;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--pink-deep);color:#fff;padding:10px 22px;border-radius:20px;font-size:14px;z-index:99;opacity:0;transition:.3s;box-shadow:var(--shadow);}
.toast.show{opacity:1;}
.sechdr{font-size:15px;font-weight:800;color:var(--pink-deep);margin:14px 0 8px;}
.empty{text-align:center;color:#c9a9b8;font-size:13px;padding:20px;}
@media(max-width:420px){.logo{font-size:11px;}.menu-item{width:74px;font-size:10px;}}
  /* 推荐卡片 */
  .rec-card{background:#fff;border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow);}
  .rec-title{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:800;color:var(--pink-deep);cursor:pointer;padding:4px 0;}
  .rec-list{display:none;margin-top:10px;}
  .rec-list.open{display:block;animation:fade .25s;}
  .rec-item{background:var(--pink-1);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:12px;line-height:1.5;display:flex;gap:8px;align-items:flex-start;}
  .rec-item .txt{flex:1;}
  .rec-item .name{font-weight:700;color:var(--pink-deep);margin-bottom:2px;}
  .rec-item .sub{color:#8b6b7b;font-size:11px;}
  .rec-disclaimer{font-size:11px;color:#c9a9b8;margin-top:6px;text-align:center;}
    /* 首页仪表盘 */
  .dash-greet{font-size:13px;color:#b089a0;margin-bottom:2px;}
  .dash-pet{text-align:center;padding:16px 0 6px;}
  .dash-bear{font-size:76px;line-height:1;display:inline-block;animation:breathe 2.4s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-6px) scale(1.04);}}
  .dash-moodtxt{font-size:14px;color:var(--pink-deep);font-weight:700;margin:6px 0 10px;text-align:center;}
  .dash-moods{display:flex;gap:6px;justify-content:center;}
  .dash-moods .mb{flex:1;background:var(--pink-1);border:2px solid transparent;border-radius:14px;padding:8px 2px;font-size:11px;text-align:center;cursor:pointer;}
  .dash-moods .mb .e{font-size:22px;display:block;}
  .dash-moods .mb.on{border-color:var(--pink-4);background:#fff;box-shadow:var(--shadow);}
  .dash-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .dash-summary .sc{background:#fff;border-radius:16px;padding:12px 10px;text-align:center;box-shadow:var(--shadow);}
  .dash-summary .sc .t{font-size:11px;color:#b089a0;margin-bottom:4px;}
  .dash-summary .sc .n{font-size:18px;font-weight:800;color:var(--pink-deep);}
  .dash-summary .sc .s{font-size:10px;color:#8b6b7b;margin-top:3px;line-height:1.3;}
  .bar{height:8px;border-radius:6px;background:var(--pink-2);margin-top:6px;overflow:hidden;}
  .bar > i{display:block;height:100%;background:linear-gradient(135deg,var(--pink-4),var(--pink-5));}
  .dash-quote{background:linear-gradient(135deg,var(--pink-4),var(--pink-5));color:#fff;border-radius:18px;padding:16px;font-size:14px;line-height:1.6;text-align:center;box-shadow:var(--shadow);margin-bottom:16px;}
  .dash-quote .qh{font-size:12px;opacity:.85;margin-top:6px;}
 </style>

<body>
<div class="app">

<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function getStore(key,def){try{return JSON.parse(localStorage.getItem('qq_'+key))||def;}catch(e){return def;}}
function setStore(key,val){localStorage.setItem('qq_'+key,JSON.stringify(val));}
function encPhone(p){try{return btoa(unescape(encodeURIComponent(p)));}catch(e){return p;}}
function decPhone(s){try{return decodeURIComponent(escape(atob(s)));}catch(e){return s;}}
function speak(text){if(!('speechSynthesis'in window)){toast('当前浏览器不支持发音');return;}const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.9;window.speechSynthesis.cancel();window.speechSynthesis.speak(u);}
/* ============ 首页仪表盘 数据与函数 ============ */
const MOODS=[
  {k:'happy',e:'😄',t:'超开心'},{k:'good',e:'🙂',t:'还不错'},
  {k:'normal',e:'😐',t:'一般'},{k:'sad',e:'😟',t:'有点丧'},{k:'angry',e:'😡',t:'想发火'}
];
const QUOTES=[
  '今天也要好好吃饭、好好爱自己。',
  '慢慢来，比较快。',

  '你已经做得很好了，真的。',
  '把日子过成自己喜欢的样子，就是最好的成功。',

  '先成为自己的光，再去照亮别人。',

  '你可以同时害怕和勇敢。',
  '生活明朗，万物可爱。',
  '别让别人的节奏，打乱你自己的步调。',
  '今天也要元气满满鸭！',
  '温柔且坚定，安静且丰盈。',
  '只要路是对的，就不怕路远。'
];
const ZODIAC=['白羊座','金牛座','双子座','巨蟹座','狮子座','处女座','天秤座','天蝎座','射手座','摩羯座','水瓶座','双鱼座'];
const FORTUNE={
  colors:['蜜桃粉','雾霾蓝','奶油白','薄荷绿','向日葵黄','薰衣草紫','珊瑚橙','天青色','燕麦色','玫瑰金','浅雾灰','樱草黄'],
  nums:[3,6,8,9,12,15,18,21,24,27,33,36],
  tips:['今天适合主动出击，机会偏爱有准备的人。','放平心态，水到渠成。','多倾听身体的声音，少内耗。','一笔小确幸正在路上，留意消息。','适合整理与复盘，清空烦恼。','与人相处多些耐心，关系更顺。','今天的你格外有魅力，大胆表达。','慢一点没关系，稳才是王道。','适合学习新东西，吸收力满分。','给自己一个小奖励，值得的。','少比较，多专注自己，幸福感up。','适合做决定，直觉很准。']
};
function getSettings(){return getStore('settings',{});}
function setSetting(k,v){const s=getSettings();s[k]=v;setStore('settings',s);}
function todayMood(){const m=getStore('moods',{});return m[todayStr()]||null;}
function setMood(k){const m=getStore('moods',{});m[todayStr()]=k;setStore('moods',m);pageDash();}
function todayCheckIn(){
  let n=0;
  if(getStore('burn',{})[todayStr()])n++;
  if(getStore('sport',{})[todayStr()])n++;
  if(getStore('english',{})[todayStr()])n++;
  if(getStore('read_check',{})[todayStr()])n++;
  return n;
}
function monthDeals(){
  const month=todayStr().slice(0,7);
  const ds=getStore('deals',[]).filter(d=>d.month===month);
  const cnt=ds.length, comm=ds.reduce((s,d)=>s+(+d.commission||0),0);
  return {cnt,comm};
}
function dayOfYear(){const d=new Date();const start=new Date(d.getFullYear(),0,0);return Math.floor((d-start)/86400000);}
function dailyQuote(){return QUOTES[dayOfYear()%QUOTES.length];}
function seedFrom(str){let h=0;for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))>>>0;return h;}
function dailyFortune(){
  const s=getSettings();const z=s.zodiac||'处女座';
  const zi=Math.max(0,ZODIAC.indexOf(z));
  const seed=seedFrom(todayStr()+z);
  const color=FORTUNE.colors[(seed+zi)%FORTUNE.colors.length];
  const num=FORTUNE.nums[(seed*7+zi)%FORTUNE.nums.length];
  const tip=FORTUNE.tips[(seed*13+zi)%FORTUNE.tips.length];
  return {z,color,num,tip};
}
function renderDashCal(){
  const d=new Date(),y=d.getFullYear(),m=d.getMonth();
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const burn=getStore('burn',{});
  const t=todayStr();
  let cells='';
  for(let i=0;i<first;i++)cells+='<div class="cell"></div>';
  for(let dd=1;dd<=days;dd++){
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
    const cls='cell'+(burn[ds]?' done':'')+(ds===t?' today':'');
    cells+='<div class="'+cls+'">'+dd+'</div>';
  }
  const wk=['日','一','二','三','四','五','六'];
  return '<div class="cal"><div class="wd">'+wk.join('</div><div class="wd">')+'</div></div><div class="cal">'+cells+'</div>';
}
function pageDash(){
  const s=getSettings();
  const d=new Date();
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  const greet=(d.getHours()<11?'早上好':d.getHours()<18?'下午好':'晚上好');
  const dateStr=(d.getMonth()+1)+'月'+d.getDate()+'日 '+wk;
  const mk=todayMood();
  const moodObj=MOODS.find(m=>m.k===mk);
  const ci=todayCheckIn();
  const md=monthDeals();
  const goal=+s.goal||10;
  const prog=Math.min(100,Math.round(md.cnt/goal*100));
  const f=dailyFortune();
  const q=dailyQuote();
  const zodiacOpts=ZODIAC.map(z=>'<option '+(s.zodiac===z?'selected':'')+'>'+z+'</option>').join('');
  content.innerHTML=
  '<div class="card">'+
    '<div class="dash-greet">'+greet+'！'+dateStr+'</div>'+
    '<div class="page-title">🐻 倩倩の小熊电台</div>'+
    '<div class="dash-pet"><span class="dash-bear">🐻</span></div>'+
    '<div class="dash-moodtxt">'+(moodObj?('今天你'+moodObj.t+moodObj.e):'今天心情怎么样？点一下小熊下面的表情告诉我～')+'</div>'+
    '<div class="dash-moods">'+MOODS.map(m=>'<div class="mb '+(mk===m.k?'on':'')+'" onclick="setMood(\''+m.k+'\')"><span class="e">'+m.e+'</span>'+m.t+'</div>').join('')+'</div>'+
  '</div>'+
  '<div class="dash-summary">'+
    '<div class="sc"><div class="t">今日打卡</div><div class="n">'+ci+'/4</div><div class="s">'+(ci===4?'全勤棒棒':(ci>0?'已打卡'+ci+'项':'还没开始'))+'</div></div>'+
    '<div class="sc"><div class="t">本月业绩</div><div class="n">'+md.cnt+'单</div><div class="s">提成¥'+md.comm.toLocaleString('zh-CN')+'</div><div class="bar"><i style="width:'+prog+'%"></i></div><div class="s">目标'+goal+'单</div></div>'+
    '<div class="sc"><div class="t">'+f.z+'运势</div><div class="n" style="font-size:13px">幸运色 '+f.color+'</div><div class="s">幸运数字 '+f.num+'<br>'+f.tip+'</div></div>'+
  '</div>'+
  '<div class="card"><div class="page-title">📅 本月日历</div>'+renderDashCal()+'</div>'+
  '<div class="dash-quote">「 '+q+' 」<div class="qh">—— 每日金句</div></div>'+
  '<div class="card"><div class="page-title">⚙️ 个性化设置</div>'+
    '<label>我的星座</label><select id="dszodiac" onchange="setSetting(\'zodiac\',this.value);pageDash();">'+zodiacOpts+'</select>'+
    '<label>月度目标单数</label><input id="dsgoal" type="number" value="'+goal+'" onchange="setSetting(\'goal\',this.value);pageDash();">'+
  '</div>';
}
const MENUS=[
{id:'dash',ico:'🏠',name:'首页'},
{id:'burn',ico:'🔥',name:'抗炎打卡'},
{id:'period',ico:'🌸',name:'生理期'},

/* ============ 1. 减脂抗炎打卡 ============ */
const MEAL_RECS=[
  {title:'清爽中式的一天',items:['水煮蛋2个 + 全麦馒头1个 + 无糖豆浆300ml · 约320kcal','番茄鸡蛋荞麦面（面80g）+ 凉拌黄瓜 · 约460kcal','清蒸鲈鱼150g + 蒜蓉西兰花 + 杂粮饭半碗 · 约410kcal'],total:1190},

function weekKeys(){const arr=[];const d=new Date();const day=(d.getDay()+6)%7;for(let i=day;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i);arr.push(fmt(x));}return arr;}
function monthKeys(){const arr=[];const d=new Date();const y=d.getFullYear(),m=d.getMonth();const n=new Date(y,m+1,0).getDate();for(let i=1;i<=n;i++){const x=new Date(y,m,i);if(x<=d)arr.push(fmt(x));}return arr;}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function renderCal(id,keys){const c=getStore('sport_check',{});const el=$('#'+id);
  const wd=['一','二','三','四','五','六','日'];let h=wd.map(w=>`<div class="wd">${w}</div>`).join('');
  // 补前导空格
  const first=new Date(keys[0]);const offset=(first.getDay()+6)%7;for(let i=0;i<offset;i++)h+='<div></div>';
  keys.forEach(k=>{const cls='cell'+(c[k]?' done':'')+(k===todayStr()?' today':'');h+=`<div class="${cls}" onclick="markSport('${k}')">${+k.slice(8,10)}</div>`;});
  el.innerHTML=h;}
function markSport(k){const c=getStore('sport_check',{});c[k]=!c[k];setStore('sport_check',c);pageSport();}
function calcContinuous(check){
  let n=0;const d=new Date();
  if(!check[fmt(d)]){d.setDate(d.getDate()-1);}
  while(check[fmt(d)]){n++;d.setDate(d.getDate()-1);}
  return n;
}

    <label>报备医院</label><input id="chosp" placeholder="如 重庆时光">
    <label>跟进备注</label><textarea id="cnote" placeholder="后续跟进情况..."></textarea>
    <button class="btn" onclick="addClient()">➕ 新增客户</button>
  </div>
  <div class="card">
    <div class="page-title">📋 客户列表（${list.length}）</div>
    <div style="overflow-x:auto"><table><thead><tr><th>姓名</th><th>电话</th><th>项目</th><th>状态</th><th>医院</th><th>操作</th></tr></thead><tbody id="ctbody"></tbody></table></div>
    <button class="btn small" onclick="exportClients()">⬇️ 导出加密CSV</button>
  </div>`;
  renderClients();
}
function renderClients(){
  const list=getStore('clients',[]);
  const tb=$('#ctbody');if(!tb)return;
  tb.innerHTML=list.map((c,i)=>`<tr><td>${c.name||'-'}</td><td>${c.phone?decPhone(c.phone).replace(/(\d{3})\d{4}(\d{4})/,'$1****$2'):'-'}</td><td>${c.proj||'-'}</td><td>${c.status||'-'}</td><td>${c.hosp||'-'}</td><td><button class="del" onclick="delClient(${i})">删</button></td></tr>`).join('')||'<tr><td colspan="6" style="text-align:center;color:#c9a9b8">暂无客户</td></tr>';
}
function addClient(){
  const list=getStore('clients',[]);
  list.push({name:$('#cname').value,phone:encPhone($('#cphone').value),proj:$('#cproj').value,status:$('#cstatus').value,hosp:$('#chosp').value,note:$('#cnote').value});
  setStore('clients',list);toast('✅ 已新增');pageClient();
}
function delClient(i){const list=getStore('clients',[]);list.splice(i,1);setStore('clients',list);toast('已删除');renderClients();}
function exportClients(){
  const list=getStore('clients',[]);
  const csv='姓名,电话(加密),项目,状态,医院,备注\n'+list.map(c=>[c.name,decPhone(c.phone||''),c.proj,c.status,c.hosp,c.note].map(v=>`"${v||''}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='客户档案_'+todayStr()+'.csv';a.click();toast('⬇️ 已导出');
}

/* ============ 7. 月度业绩记账对账 ============ */
const HOSP_RATE={
  '重庆铜雀台':{手术:0.35,植发:0.30,皮肤:0.30,针剂:0.30},
  '重庆米兰柏羽时光':{手术:0.35,皮肤:0.35,针剂:0.35,植发:0.35},
  '重庆时光':{手术:0.35,皮肤:0.35,针剂:0.35,植发:0.35},
  '晶肤':{皮肤:0.30,针剂:0.30},
  '军美':{手术:0.35,皮肤:0.30,针剂:0.30},
  '军科':{手术:0.30,皮肤:0.25,针剂:0.25},
  '美轮美奂':{手术:0.30,皮肤:0.30,针剂:0.30},
  '艺星':{手术:0.30,皮肤:0.30,针剂:0.30},
  '联合丽格':{手术:0.30,皮肤:0.30,针剂:0.30},
  '松山':{手术:0.30,颌面:0.25},
};
function projType(p){if(/双眼皮|隆鼻|隆胸|吸脂|眼|鼻|胸|轮廓|下颌|颧骨|颌面|手术/.test(p))return'手术';if(/玻尿酸|肉毒|针|水光/.test(p))return'针剂';if(/植发|毛发/.test(p))return'植发';if(/光子|激光|热玛吉|皮|肤|嫩肤|清洁/.test(p))return'皮肤';return'手术';}
function pageAccount(){
  const month=todayStr().slice(0,7);
  const deals=getStore('deals',[]).filter(d=>d.month===month);
  content.innerHTML=`
  <div class="card">
    <div class="page-title">💰 月度业绩记账对账</div>
    <div class="page-sub">${month} · 自动按合作医院合同核算提成</div>
    <label>成交客户电话</label><input id="dphone" placeholder="11位">
    <label>合作医院</label>
    <select id="dhosp">${Object.keys(HOSP_RATE).map(h=>`<option>${h}</option>`).join('')}</select>
    <label>成交项目</label><input id="dproj" placeholder="如 双眼皮/玻尿酸（决定提成比例）">
    <label>成交总金额(元)</label><input id="damount" type="number" placeholder="如 4500">
    <button class="btn" onclick="addDeal()">➕ 录入成交</button>
  </div>
  <div class="card">
    <div class="page-title">📊 ${month} 汇总</div>
    <div class="stat-grid">
      <div class="stat"><div class="num">${deals.length}</div><div class="lab">成交笔数</div></div>
      <div class="stat"><div class="num">${sum(deals,'amount')}</div><div class="lab">总营收(元)</div></div>
      <div class="stat"><div class="num">${sum(deals,'commission')}</div><div class="lab">总提成(元)</div></div>
    </div>
    <div class="sechdr">各医院业绩分布</div>
    <div style="overflow-x:auto"><table><thead><tr><th>医院</th><th>笔数</th><th>营收</th><th>提成</th></tr></thead><tbody id="hospTb"></tbody></table></div>
    <div class="sechdr">明细</div>
    <div style="overflow-x:auto"><table><thead><tr><th>电话</th><th>医院</th><th>项目类型</th><th>金额</th><th>提成</th></tr></thead><tbody id="dealTb"></tbody></table></div>
    <button class="btn small" onclick="exportDeals()">⬇️ 导出月度报表</button>
  </div>`;
  renderAccount(deals);
}
function sum(arr,k){return arr.reduce((s,d)=>s+(+d[k]||0),0).toLocaleString('zh-CN');}
function calcCommission(hosp,proj,amount){const map=HOSP_RATE[hosp];if(!map)return 0;let type=projType(proj);let rate=map[type];if(rate==null)rate=map['手术']||0;return Math.round(amount*rate);}
function addDeal(){
  const month=todayStr().slice(0,7);
  const hosp=$('#dhosp').value,proj=$('#dproj').value,amount=+$('#damount').value;
  if(!amount){toast('请填金额');return;}
  const comm=calcCommission(hosp,proj,amount);
  const deals=getStore('deals',[]);
  deals.push({month,phone:encPhone($('#dphone').value),hosp,proj,type:projType(proj),amount,commission:comm});
  setStore('deals',deals);toast('✅ 已录入，提成¥'+comm);pageAccount();
}
function renderAccount(deals){
  const tb=$('#dealTb');if(tb)tb.innerHTML=deals.map(d=>`<tr><td>${d.phone?decPhone(d.phone).slice(-4).padStart(decPhone(d.phone).length,'*'):'-'}</td><td>${d.hosp}</td><td>${d.type}</td><td>${d.amount.toLocaleString()}</td><td>${d.commission.toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="5" style="text-align:center;color:#c9a9b8">本月暂无成交</td></tr>';
  const map={};deals.forEach(d=>{if(!map[d.hosp])map[d.hosp]={n:0,a:0,c:0};map[d.hosp].n++;map[d.hosp].a+=d.amount;map[d.hosp].c+=d.commission;});
  const hb=$('#hospTb');if(hb)hb.innerHTML=Object.keys(map).map(h=>`<tr><td>${h}</td><td>${map[h].n}</td><td>${map[h].a.toLocaleString()}</td><td>${map[h].c.toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center;color:#c9a9b8">暂无</td></tr>';
}
function exportDeals(){
  const month=todayStr().slice(0,7);
  const deals=getStore('deals',[]).filter(d=>d.month===month);
  const csv='月份,医院,项目类型,金额,提成\n'+deals.map(d=>[d.month,d.hosp,d.type,d.amount,d.commission].map(v=>`"${v}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='月度对账_'+month+'.csv';a.click();toast('⬇️ 已导出');
}

function togglePod(){const c=getStore('pod_check',{});const t=todayStr();c[t]=!c[t];setStore('pod_check',c);toast(c[t]?'🎧 已标记':'已取消');pagePodcast();}

/* ============ 9. 每周自律复盘 ============ */
function pageReview(){
  const burn=getStore('burn',{}),sport=getStore('sport_check',{}),en=getStore('en_hist',[]),read=getStore('read_check',{});
  const weekDays=weekKeys();
  const sportWk=weekDays.filter(k=>sport[k]).length;
  const readWk=weekDays.filter(k=>read[k]).length;
  const enWk=en.filter(h=>weekDays.includes(h.date)).length;
  const weights=Object.keys(burn).sort().slice(-7).map(k=>burn[k].weight).filter(Boolean);
  const trend=weights.length>=2?(weights[weights.length-1]-weights[0]).toFixed(1):'-';
  content.innerHTML=`
  <div class="card">
    <div class="page-title">📝 每周自律复盘</div>
    <div class="page-sub">${weekDays[0]} ~ ${weekDays[weekDays.length-1]}</div>
    <div class="item"><h4>⚖️ 体重趋势</h4><p>近7天记录 ${weights.length} 次 ｜ 变化 ${trend}kg ${trend!=='-'&&trend<0?'（↓ 减脂中，棒！）':''}</p></div>
    <div class="item"><h4>🌸 皮肤/抗炎</h4><p>${Object.keys(burn).sort().slice(-7).map(k=>`${k.slice(5)}:${burn[k].skin||'-'}`).join(' ｜ ')||'暂无'}</p></div>
    <div class="item"><h4>🏃 运动完成</h4><p>本周打卡 ${sportWk}/7 天</p></div>
    <div class="item"><h4>📖 英语进度</h4><p>本周学习 ${enWk} 天，累计 ${en.length} 天</p></div>
    <div class="item"><h4>📚 阅读完成</h4><p>本周 ${readWk}/7 天</p></div>
    <div class="item"><h4>💼 工作优化</h4><p>本月客户 ${getStore('clients',[]).length} 人 ｜ 成交 ${getStore('deals',[]).filter(d=>d.month===todayStr().slice(0,7)).length} 笔</p></div>
  </div>
  <div class="card">
    <div class="page-title">💾 数据备份与恢复</div>
    <div class="page-sub">建议每周备份一次。换设备 / 清理 Safari 前务必备份，防止记录丢失</div>
    <button class="btn" onclick="backupAll()">⬇️ 一键备份全部数据</button>
    <label>从备份文件恢复（覆盖当前数据）</label>
    <input type="file" id="restoreFile" accept="application/json,.json" onchange="restoreAll(this.files[0])">
  </div>`;
}
function backupAll(){
  const keys=['burn','period','sport_check','en_hist','read_check','clients','deals','pod_check'];
  const data={};keys.forEach(k=>data[k]=getStore(k,null));
  data.__app='qq_workbench';data.__time=new Date().toISOString();
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='倩倩工作台备份_'+todayStr()+'.json';a.click();
  toast('⬇️ 已备份全部数据');
}
function restoreAll(f){
  if(!f){return;}
  const r=new FileReader();
  r.onload=()=>{try{
    const data=JSON.parse(r.result);
    if(data.__app!=='qq_workbench'){toast('⚠️ 不是工作台备份文件');return;}
    Object.keys(data).forEach(k=>{if(k.startsWith('__'))return;setStore(k,data[k]);});
    toast('✅ 已恢复数据');showPage('burn');
  }catch(e){toast('⚠️ 恢复失败，文件已损坏');}};
  r.readAsText(f);
}
